spring.application.name=maestros
server.port=8080

# Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/maestros
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Eureka: desactivado mientras no tengas un servidor Eureka corriendo
eureka.client.enabled=false