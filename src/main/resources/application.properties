spring.application.name=maestros
server.port=8080

# Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/maestros?createDatabaseIfNotExist=true
spring.datasource.username=root
# XAMPP trae root sin contraseña; si le pusiste una, defínela en la variable DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:6fc77c5b930d6a951ff5863ffa77af01a2cfa43107a17aadee7ac62335cf1008}
jwt.expiration-ms=3600000

# Eureka: desactivado mientras no tengas un servidor Eureka corriendo
eureka.client.enabled=false

#Flyway
spring.flyway.enabled=true
# La BD ya tenia tablas antes de usar Flyway: se marca V1 y V2 como aplicadas y se conservan los datos
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration